[project]
name = "ai-usage"
version = "0.1.0"
description = "Uso e limites de Claude Code, Codex e OpenRouter no polybar, com painel e multi-conta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.12.0"]

[project.scripts]
agents = "agents_usage.cli:main"
agents-panel = "agents_usage.panel.main:main"
agents-private-browser = "agents_usage.cli:private_browser"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_usage"]
